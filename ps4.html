<!DOCTYPE html>
<html lang="id">
<head>

    <title>Library PS4- DREAMS PS</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container">
        <div class="header-wrap">
            <a href="index.html" class="back-btn">← Kembali</a>

            <div class="subhead">Koleksi game PlayStation 4</div>
        </div>

        <div class="stats">

                <div class="number" id="total-games">0</div>

        </div>

        loadGames('ps4');
